# The one pipeline. On every push to main and every pull request it
# scaffolds an app as `npm create` would, installs it from npmjs, runs it
# headlessly and typechecks it. A `v*` tag does the same, then publishes
# @qxuken/create-kui-node to npmjs.
#
# npmjs needs no secret: the package trusts this workflow as its publisher
# (npmjs.com → @qxuken/create-kui-node → Settings → Trusted Publisher:
# GitHub Actions, qxuken/kui-node-template, release.yml, with "Allow npm
# publish"). The publish job asks GitHub for an OIDC token (`id-token:
# write`) and npm trades it for a short-lived publish token, so a tag goes
# live with no approval, and with provenance.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The headless run shapes real text; without a font every glyph is
      # missing and the layout collapses. It also loads the prebuilt addon,
      # which links ALSA for audio playback: no libasound and it fails at
      # dlopen, before a single line of the app runs.
      - name: Install system deps
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core libasound2t64

      - name: Scaffold, install, run, typecheck
        run: |
          set -eu
          node index.mjs --help
          node index.mjs "$RUNNER_TEMP/scaffold/my-app"
          cd "$RUNNER_TEMP/scaffold/my-app"
          test ! -e .npmrc
          npm install
          npm run headless
          npm run typecheck

      - name: Pack
        run: npm pack --dry-run

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # id-token is npm's trusted publishing: the OIDC token npmjs trades for
    # a publish token. It is asked for here only, never workflow-wide.
    permissions:
      contents: read
      id-token: write
    env:
      NPMJS_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs Node 22.14 and npm 11.5.1 or newer. No
      # cache: nothing restored from one should reach a publish.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Tag matches package.json
        run: |
          set -eu
          ver=$(node -p 'require("./package.json").version')
          test "v$ver" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json $ver" >&2; exit 1; }

      # setup-node's npm lives under the runner's own tool cache, so this
      # install needs no sudo.
      - name: npm 11.5.1 or newer
        run: |
          set -eu
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install -g npm@11
          fi
          npm --version

      # npm finds the OIDC environment itself, takes no token and attaches
      # provenance. Prereleases get their identifier as the dist-tag; plain
      # versions become `latest`, which is what `npm create
      # @qxuken/kui-node` picks. A re-run finds the version live and stops.
      - name: npm publish (npmjs)
        run: |
          set -eu
          pkg=$(node -p 'require("./package.json").name')
          ver=$(node -p 'require("./package.json").version')
          tag=latest
          case "$ver" in *-*) tag="${ver#*-}"; tag="${tag%%.*}";; esac
          if [ "$(npm view "$pkg@$ver" version --registry "$NPMJS_REGISTRY" 2>/dev/null || true)" = "$ver" ]; then
            echo "$pkg@$ver is already live on npmjs"
            exit 0
          fi
          npm publish --registry "$NPMJS_REGISTRY" --tag "$tag" --access public
          npm view "$pkg" dist-tags --registry "$NPMJS_REGISTRY"
